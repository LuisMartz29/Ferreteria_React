services:
  mysql:
    image: mysql:8.0
    container_name: mysql-ferreteria
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: ferreteria_db
      MYSQL_USER: ferreteria
      MYSQL_PASSWORD: ferreteria123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: backend-ferreteria
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ferreteria_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ferreteria
      SPRING_DATASOURCE_PASSWORD: ferreteria123
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: frontend-ferreteria
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
